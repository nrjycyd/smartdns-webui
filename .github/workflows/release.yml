name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test PWA
        run: npm run test:pwa

      - name: Test group appearance
        run: npm run test:groups

      - name: Test client names
        run: npm run test:clients

      - name: Test column widths
        run: npm run test:columns

      - name: Build
        run: npm run build

      - name: Package dated release
        id: package
        run: |
          set -euo pipefail
          tag="v1.0.0-pwa-$(date +'%Y%m%d-%H%M%S')"
          asset="smartdns-ui-${tag}.tar.gz"
          checksum="${asset}.sha256"

          tar -czf "$asset" -C out .
          sha256sum "$asset" > "$checksum"

          printf 'tag=%s\nasset=%s\nchecksum=%s\n' \
            "$tag" "$asset" "$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          {
            printf 'SmartDNS WebUI PWA automated build.\n\n'
            printf -- '- Version: `%s`\n' "$TAG"
            printf -- '- Built at (Asia/Shanghai): %s\n' "$(date +'%Y-%m-%d %H:%M:%S %Z')"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Workflow: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Deploy the contents of the `.tar.gz` archive to the SmartDNS WebUI web root.\n'
            printf 'The `.sha256` file contains the archive checksum.\n'
          } > release-notes.md

          gh release create "$TAG" "$ASSET" "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

          printf '## Release published\n\n[%s](%s/%s/releases/tag/%s)\n' \
            "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
